name: Release

# Push a tag like v0.2.0 to build a universal app and publish a GitHub release
# with a DMG, a zip and SHA256SUMS.txt. Can also be run by hand from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Work out version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      - name: Protocol checks
        run: swift run -c release NothingKitChecks

      - name: Build app (universal)
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/build-app.sh --universal

      - name: Package DMG and zip
        run: scripts/make-dmg.sh "${{ steps.version.outputs.version }}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          NOTES=$(cat <<NOTES
          ## Install

          1. Download **Nothing-X-Mac-$VERSION.dmg**, open it and drag **Nothing X Mac** into **Applications**.
          2. The app is ad-hoc signed, not notarized. On first launch macOS blocks it: open
             **System Settings → Privacy & Security** and click **Open Anyway**, or run
             \`xattr -dr com.apple.quarantine "/Applications/Nothing X Mac.app"\`.
          3. Allow Bluetooth access when asked.

          Universal build (Apple Silicon and Intel), macOS 13 or later.
          Checksums are in SHA256SUMS.txt.
          NOTES
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Nothing X Mac $VERSION" --notes "$NOTES" \
              --target "${{ github.sha }}"
          fi
